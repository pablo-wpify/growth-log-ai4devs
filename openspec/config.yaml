schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: Growth Log, monolito Rails con PostgreSQL. La fuente de cada
  cambio es su ticket en docs/tickets/. La secuencia vigente, los cambios
  de alcance y las decisiones pendientes de la entrega 2 están solo en
  docs/plan-entrega-2.md. La documentación de la entrega 1
  (propuesta-mvp.md, prompts.md y anexos/) es de solo lectura salvo pedido
  explícito: alcance completo del MVP en anexos/anexo-g-plan-incremental.md, ADR en
  anexos/anexo-d-decisiones-arquitectura.md, decisiones de privacidad en
  anexos/anexo-c-riesgos-decisiones.md, criterios en anexos/anexo-a-historias.md.
  ensayo/ y openspec/changes/archive/2026-11-02-e1-base-rails son
  procedencia del ensayo: no se modifican y sus verificaciones no cuentan
  como verificaciones del producto. Decisiones del producto: docs/decisiones/.

  Decisiones aprobadas: D1, D2, D5, AM-1 a AM-5 y criterios 3.9, 4.11 y 4.12
  (entrega 1); ADR-1 (monolito Rails), Ruby 4.0.9, Rails 8.1.4 (8.1.4.1
  desde GL-01b, P-18),
  PostgreSQL 18.6, RSpec y las decisiones D-GL01-1 a D-GL01-4 (GL-01);
  ADR-2 y D-GL02-1 a D-GL02-7 (GL-02); recorrido núcleo priorizado y
  alcance diferido (plan de la entrega 2, sección 1). Lo diferido sigue
  siendo requisito pendiente.
  Aprobadas para GL-03: ADR-3 (P-5), P-7, P-8, P-9 y P-12 (plan de la
  entrega 2, 02/11/2026). Aprobadas para GL-08: P-6, P-13 y P-14 (03/11/2026).
  Aprobadas para GL-06: P-1 (dimensiones), P-2 (señales), P-3 (dimensión y
  señal obligatorias para «lista») y P-11 (sin «+ Feedback»), 12/11/2026.
  Decididas para GL-06: P-19 a P-26 (rutas, escritura con persona activa,
  sección de entradas propias, captura en página propia, zona horaria
  America/Argentina/Buenos_Aires, detalle sin acceso a la ficha solo por URL
  directa, «Marcar como lista» idempotente y reasignación de PT-11 fuera),
  13/11/2026. Cambio de GL-06 aprobado el 13/11/2026.
  Aprobada para GL-07: P-10 (cronología ascendente por fecha del hecho,
  desempate por created_at e id, borradores marcados «fuera del resumen»),
  14/11/2026, con el alcance de 4.3, 4.4, 4.5 y 1.15 decidido ese día.
  Cambio de GL-07 aprobado el 14/11/2026.
  Aprobada para GL-09: P-4 (ADR-6: pruebas de sistema de RSpec con Capybara
  y selenium-webdriver en Chrome sin interfaz), 14/11/2026.
  Decididas para GL-10: P-27 (demo editable con datos ficticios, M212) y
  P-28, P-29 y P-31 (build con tarea demo, contraseñas iniciales desde
  secretos de Render, marcas propias; M214). P-30 sigue pendiente.
  Aprobadas para GL-11: P-32 (las pantallas internas como referencia
  visual, sin mock del login) y P-33 (max-width de 24rem con ancho fluido),
  M240.
  Abiertas: ADR-5, ADR-7, ADR-8, D3, D4 y las demás decisiones P del plan
  de la entrega 2.

  Restricciones:
  - No agregar funciones que el ticket no pida.
  - No actualizar versiones dentro de un cambio que no lo pida.
  - Sin credenciales locales o reales en el repositorio: la base se configura
    por variables DATABASE_* desde un .env ignorado. La única contraseña
    versionada es la del servicio de PostgreSQL del CI, exclusivamente de
    prueba.
  - Un criterio que solo se verifica en GitHub Actions queda pendiente hasta
    ejecutarlo; no se declara completo ni se archiva el cambio mientras siga
    pendiente.
  - Distinguir lo decidido, lo propuesto y lo verificado.
  - Denegar por defecto: toda acción del producto verifica autorización y
    usa consultas con alcance; probar siempre el acceso que debe fallar.
  - No relajar reglas de privacidad (PP-1 a PP-9) sin una decisión
    explícita registrada.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
